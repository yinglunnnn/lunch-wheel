<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>今天吃什麼？午餐決策大輪盤 🍕</title>
  <!-- 引入 Google Fonts 圓潤字體與 Confetti 特效庫 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --bg-yellow: #FFF9E6;
      --card-bg: #FFFFFF;
      --primary-yellow: #FFD23F;
      --primary-hover: #F4C425;
      --accent-orange: #FF7B54;
      --accent-dark: #3D2C1D;
      --accent-gray: #8F8073;
      --border-color: #3D2C1D;
      --shadow-offset: 4px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Zen Maru Gothic', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-yellow);
      color: var(--accent-dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 40px;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    h1 {
      font-size: 2rem;
      font-weight: 900;
      color: var(--accent-dark);
      letter-spacing: 1px;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    header p {
      font-size: 0.95rem;
      color: var(--accent-gray);
      font-weight: 700;
    }

    .main-container {
      width: 100%;
      max-width: 900px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 28px;
    }

    @media (min-width: 768px) {
      .main-container {
        grid-template-columns: 1.1fr 0.9fr;
        align-items: start;
      }
    }

    /* 輪盤區塊 */
    .wheel-panel {
      background: var(--card-bg);
      border: 3px solid var(--border-color);
      border-radius: 28px;
      padding: 24px 16px 28px;
      box-shadow: var(--shadow-offset) var(--shadow-offset) 0 var(--border-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    .wheel-wrapper {
      position: relative;
      width: 320px;
      height: 320px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    @media (min-width: 400px) {
      .wheel-wrapper {
        width: 350px;
        height: 350px;
      }
    }

    #wheelCanvas {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 4px solid var(--border-color);
      background: #FFF;
      box-shadow: 0 4px 12px rgba(61, 44, 29, 0.08);
    }

    /* 頂部指針 */
    .wheel-pointer {
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 34px;
      height: 38px;
      z-index: 10;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
    }

    .wheel-pointer svg {
      width: 100%;
      height: 100%;
      fill: var(--accent-orange);
      stroke: var(--border-color);
      stroke-width: 2;
    }

    /* 中心圓點裝飾 */
    .wheel-center-cap {
      position: absolute;
      width: 44px;
      height: 44px;
      background: var(--primary-yellow);
      border: 3px solid var(--border-color);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      z-index: 5;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }

    .btn-spin {
      background: var(--primary-yellow);
      color: var(--accent-dark);
      font-size: 1.25rem;
      font-weight: 900;
      border: 3px solid var(--border-color);
      padding: 12px 40px;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 3px 3px 0 var(--border-color);
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-spin:hover:not(:disabled) {
      transform: translate(-1px, -1px);
      box-shadow: 4px 4px 0 var(--border-color);
      background: var(--primary-hover);
    }

    .btn-spin:active:not(:disabled) {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 var(--border-color);
    }

    .btn-spin:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* 設定面板區塊 */
    .config-panel {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .card {
      background: var(--card-bg);
      border: 3px solid var(--border-color);
      border-radius: 24px;
      padding: 18px 20px;
      box-shadow: var(--shadow-offset) var(--shadow-offset) 0 var(--border-color);
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 900;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* 分類標籤按鈕 */
    .filter-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .btn-tag {
      background: #FFFDF5;
      border: 2px solid var(--border-color);
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--accent-dark);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-tag.active {
      background: var(--primary-yellow);
      box-shadow: 2px 2px 0 var(--border-color);
      transform: translate(-1px, -1px);
    }

    /* 選項清單 */
    .item-input-wrapper {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .item-input {
      flex: 1;
      padding: 8px 14px;
      border: 2px solid var(--border-color);
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 700;
      background: #FFFDF5;
      outline: none;
    }

    .item-input:focus {
      border-color: var(--accent-orange);
    }

    .btn-add {
      background: var(--accent-orange);
      color: #FFF;
      border: 2px solid var(--border-color);
      border-radius: 12px;
      padding: 0 16px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 2px 2px 0 var(--border-color);
      transition: all 0.15s;
    }

    .btn-add:hover {
      opacity: 0.95;
    }

    .item-list {
      max-height: 220px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-right: 4px;
    }

    .item-badge {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 7px 12px;
      background: #FFFDF5;
      border: 1.5px solid var(--border-color);
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 700;
    }

    .btn-del {
      background: none;
      border: none;
      color: #D32F2F;
      font-weight: 900;
      font-size: 1rem;
      cursor: pointer;
      padding: 0 4px;
    }

    .btn-reset {
      margin-top: 10px;
      background: transparent;
      border: none;
      color: var(--accent-gray);
      font-size: 0.8rem;
      font-weight: 700;
      text-decoration: underline;
      cursor: pointer;
      align-self: flex-start;
    }

    /* 獲勝彈窗 Modal */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(2px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 100;
      padding: 20px;
    }

    .modal-card {
      background: #FFF;
      border: 4px solid var(--border-color);
      border-radius: 28px;
      padding: 30px 24px;
      width: 100%;
      max-width: 360px;
      text-align: center;
      box-shadow: 6px 6px 0 var(--border-color);
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      0% { transform: scale(0.7); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .modal-emoji {
      font-size: 3.5rem;
      margin-bottom: 8px;
      display: block;
    }

    .modal-title {
      font-size: 1.1rem;
      color: var(--accent-gray);
      font-weight: 700;
      margin-bottom: 4px;
    }

    .modal-result {
      font-size: 1.9rem;
      font-weight: 900;
      color: var(--accent-orange);
      margin-bottom: 22px;
      letter-spacing: 1px;
    }

    .modal-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn-maps {
      background: #4285F4;
      color: white;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 10px 16px;
      border-radius: 999px;
      border: 2px solid var(--border-color);
      box-shadow: 2px 2px 0 var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-close-modal {
      background: var(--primary-yellow);
      border: 2px solid var(--border-color);
      border-radius: 999px;
      padding: 10px;
      font-weight: 900;
      font-size: 0.95rem;
      cursor: pointer;
      box-shadow: 2px 2px 0 var(--border-color);
    }
  </style>
</head>
<body>

  <header>
    <h1>🍕 今天吃什麼？ 🍜</h1>
    <p>轉動活力轉盤，一秒拯救選擇障礙！</p>
  </header>

  <main class="main-container">
    <!-- 左側：輪盤主舞台 -->
    <section class="wheel-panel">
      <div class="wheel-wrapper">
        <div class="wheel-pointer">
          <svg viewBox="0 0 24 28">
            <path d="M12 28L0 4C0 1.79 5.37 0 12 0s12 1.79 12 4L12 28z"/>
          </svg>
        </div>
        <div class="wheel-center-cap">🍽️</div>
        <canvas id="wheelCanvas" width="700" height="700"></canvas>
      </div>
      <button id="spinBtn" class="btn-spin">🎯 開始轉盤！</button>
    </section>

    <!-- 右側：設定與分類 -->
    <section class="config-panel">
      <!-- 篩選器 -->
      <div class="card">
        <div class="card-title">🏷️ 情境分類篩選</div>
        <div class="filter-group">
          <button class="btn-tag active" data-filter="all">全部選項</button>
          <button class="btn-tag" data-filter="cheap">💰 銅板百元</button>
          <button class="btn-tag" data-filter="healthy">🥗 清爽低負擔</button>
          <button class="btn-tag" data-filter="treat">🍖 犒賞聚餐</button>
        </div>
      </div>

      <!-- 選項清單管理 -->
      <div class="card">
        <div class="card-title">✏️ 自訂候補清單 (<span id="itemCount">0</span>)</div>
        <div class="item-input-wrapper">
          <input type="text" id="newItemInput" class="item-input" placeholder="新增店家或料理..." maxlength="12">
          <button id="addItemBtn" class="btn-add">新增</button>
        </div>
        <div class="item-list" id="itemListContainer"></div>
        <button id="resetBtn" class="btn-reset">↺ 恢復預設推薦選單</button>
      </div>
    </section>
  </main>

  <!-- 中獎彈出視窗 -->
  <div class="modal-overlay" id="resultModal">
    <div class="modal-card">
      <span class="modal-emoji">🎉</span>
      <div class="modal-title">命運的選擇出爐啦！</div>
      <div class="modal-result" id="modalWinnerName">健康餐盒</div>
      <div class="modal-actions">
        <a id="mapsLink" href="#" target="_blank" rel="noopener noreferrer" class="btn-maps">
          📍 在 Google Maps 搜尋附近店家
        </a>
        <button id="closeModalBtn" class="btn-close-modal">太棒了，就吃這個！</button>
      </div>
    </div>
  </div>

  <script>
    // 預設資料庫（附帶活潑的鮮豔黃橘/馬卡龍跳色）
// 擴充至 16 種豐富的美食選項
    const PRESET_ITEMS = [
      { name: "排骨/雞腿便當", category: "cheap", color: "#FFD23F" },
      { name: "舒肥雞健康餐", category: "healthy", color: "#95D5B2" },
      { name: "牛肉麵/乾拌麵", category: "cheap", color: "#FFAAA6" },
      { name: "日式拉麵", category: "treat", color: "#FF8E72" },
      { name: "手工水餃/鍋貼", category: "cheap", color: "#FEE440" },
      { name: "溫沙拉/輕食", category: "healthy", color: "#B7E4C7" },
      { name: "義大利麵/燉飯", category: "treat", color: "#FFB3C6" },
      { name: "超商飯糰鮮食", category: "cheap", color: "#A0C4FF" },
      { name: "韓式石鍋拌飯", category: "treat", color: "#FFC6FF" },
      { name: "小火鍋/麻辣燙", category: "treat", color: "#FF9E80" },
      { name: "滷肉飯/控肉飯", category: "cheap", color: "#FFE082" },
      { name: "越式生春捲河粉", category: "healthy", color: "#B9F6CA" },
      { name: "美式漢堡薯條", category: "treat", color: "#FF8A80" },
      { name: "日式定食丼飯", category: "treat", color: "#D7CCC8" },
      { name: "素食蔬食自助餐", category: "healthy", color: "#C8E6C9" },
      { name: "地瓜茶葉蛋豆漿", category: "healthy", color: "#FFF59D" }
    ];

    // 調色盤供自訂新增使用
    const COLOR_PALETTE = ["#FFD23F", "#FFAAA6", "#FF8E72", "#FEE440", "#95D5B2", "#A0C4FF", "#FFB3C6", "#FFC6FF"];

    // 狀態變數
    let currentCategory = 'all';
    let storedItems = JSON.parse(localStorage.getItem('lunch_items_v1')) || [...PRESET_ITEMS];
    let filteredItems = [];

    // Canvas 相關變數
    const canvas = document.getElementById('wheelCanvas');
    const ctx = canvas.getContext('2d');
    const center = canvas.width / 2;
    const radius = center - 12;

    let currentAngle = 0; // 當前旋轉角度 (弧度)
    let isSpinning = false;

    // DOM 元素
    const spinBtn = document.getElementById('spinBtn');
    const newItemInput = document.getElementById('newItemInput');
    const addItemBtn = document.getElementById('addItemBtn');
    const resetBtn = document.getElementById('resetBtn');
    const itemListContainer = document.getElementById('itemListContainer');
    const itemCountSpan = document.getElementById('itemCount');
    const filterButtons = document.querySelectorAll('.btn-tag');
    const resultModal = document.getElementById('resultModal');
    const modalWinnerName = document.getElementById('modalWinnerName');
    const mapsLink = document.getElementById('mapsLink');
    const closeModalBtn = document.getElementById('closeModalBtn');

    // 依類別篩選項目
    function applyFilter() {
      if (currentCategory === 'all') {
        filteredItems = [...storedItems];
      } else {
        filteredItems = storedItems.filter(item => item.category === currentCategory);
      }
      renderItemList();
      drawWheel();
      spinBtn.disabled = filteredItems.length < 2 || isSpinning;
    }

    // 儲存至 localStorage
    function saveItems() {
      localStorage.setItem('lunch_items_v1', JSON.stringify(storedItems));
      applyFilter();
    }

    // 繪製輪盤
    function drawWheel() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const total = filteredItems.length;

      if (total === 0) {
        ctx.fillStyle = "#E0E0E0";
        ctx.beginPath();
        ctx.arc(center, center, radius, 0, 2 * Math.PI);
        ctx.fill();
        ctx.fillStyle = "#8F8073";
        ctx.font = "bold 28px 'Zen Maru Gothic'";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("此分類無選項，請新增！", center, center);
        return;
      }

      const arc = (2 * Math.PI) / total;

      for (let i = 0; i < total; i++) {
        const angle = currentAngle + i * arc;
        
        // 繪製扇形
        ctx.beginPath();
        ctx.fillStyle = filteredItems[i].color || COLOR_PALETTE[i % COLOR_PALETTE.length];
        ctx.moveTo(center, center);
        ctx.arc(center, center, radius, angle, angle + arc);
        ctx.closePath();
        ctx.fill();

        // 扇形框線
        ctx.lineWidth = 3;
        ctx.strokeStyle = "#3D2C1D";
        ctx.stroke();

        // 繪製文字
        ctx.save();
        ctx.fillStyle = "#3D2C1D";
        ctx.font = "bold 26px 'Zen Maru Gothic'";
        ctx.textAlign = "right";
        ctx.textBaseline = "middle";

        const textAngle = angle + arc / 2;
        ctx.translate(center, center);
        ctx.rotate(textAngle);
        
        // 限制文字長度或自適應
        let label = filteredItems[i].name;
        if (label.length > 7) label = label.substring(0, 6) + "..";
        ctx.fillText(label, radius - 30, 0);
        ctx.restore();
      }
    }

    // 旋轉動態 (物理減速)
    function spinWheel() {
      if (isSpinning || filteredItems.length < 2) return;

      isSpinning = true;
      spinBtn.disabled = true;

      // 隨機旋轉圈數 (5~9 圈) + 隨機角度
      const totalRotations = (Math.PI * 2) * (5 + Math.random() * 4);
      const spinDuration = 3800; // 毫秒
      const startTime = performance.now();
      const startAngle = currentAngle;

      function animate(now) {
        const elapsed = now - startTime;
        const progress = Math.min(elapsed / spinDuration, 1);
        
        // Ease-out cubic 曲線
        const easeOut = 1 - Math.pow(1 - progress, 3);
        currentAngle = startAngle + totalRotations * easeOut;
        drawWheel();

        if (progress < 1) {
          requestAnimationFrame(animate);
        } else {
          isSpinning = false;
          spinBtn.disabled = false;
          determineWinner();
        }
      }

      requestAnimationFrame(animate);
    }

    // 計算指針停留在哪一個項目（指針位於 12 點鐘方向，角度為 3π/2 或 -π/2）
    function determineWinner() {
      const total = filteredItems.length;
      const arc = (2 * Math.PI) / total;
      
      // 指針固定在頂部 270 度 (1.5 * PI)
      const pointerAngle = 1.5 * Math.PI;
      
      // 計算當前輪盤相對於頂部指針的偏移
      let normalizedAngle = (pointerAngle - (currentAngle % (2 * Math.PI))) % (2 * Math.PI);
      if (normalizedAngle < 0) normalizedAngle += 2 * Math.PI;

      const winningIndex = Math.floor(normalizedAngle / arc) % total;
      const winner = filteredItems[winningIndex];

      showResult(winner.name);
    }

    // 彈出獲獎畫面並發射紙花
    function showResult(name) {
      modalWinnerName.textContent = name;
      mapsLink.href = `https://www.google.com/maps/search/${encodeURIComponent(name)}`;
      resultModal.style.display = 'flex';

      // 慶祝紙花特效
      confetti({
        particleCount: 80,
        spread: 70,
        origin: { y: 0.6 },
        colors: ['#FFD23F', '#FF7B54', '#95D5B2', '#FFAAA6']
      });
    }

    // 渲染右側自訂清單
    function renderItemList() {
      itemListContainer.innerHTML = '';
      itemCountSpan.textContent = filteredItems.length;

      filteredItems.forEach((item) => {
        const badge = document.createElement('div');
        badge.className = 'item-badge';
        badge.innerHTML = `
          <span>${item.name}</span>
          <button class="btn-del" title="刪除">✕</button>
        `;

        badge.querySelector('.btn-del').addEventListener('click', () => {
          storedItems = storedItems.filter(i => i.name !== item.name);
          saveItems();
        });

        itemListContainer.appendChild(badge);
      });
    }

    // 事件監聽
    spinBtn.addEventListener('click', spinWheel);

    // 新增項目
    function addItem() {
      const name = newItemInput.value.trim();
      if (!name) return;
      if (storedItems.some(i => i.name === name)) {
        alert("此項目已經在清單中了！");
        return;
      }

      const randomColor = COLOR_PALETTE[Math.floor(Math.random() * COLOR_PALETTE.length)];
      storedItems.push({
        name,
        category: currentCategory === 'all' ? 'cheap' : currentCategory,
        color: randomColor
      });

      newItemInput.value = '';
      saveItems();
    }

    addItemBtn.addEventListener('click', addItem);
    newItemInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') addItem();
    });

    // 分類標籤切換
    filterButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        filterButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentCategory = btn.dataset.filter;
        applyFilter();
      });
    });

    // 恢復預設
    resetBtn.addEventListener('click', () => {
      if (confirm("確定要恢復預設美食清單嗎？")) {
        storedItems = [...PRESET_ITEMS];
        saveItems();
      }
    });

    // 關閉彈窗
    closeModalBtn.addEventListener('click', () => {
      resultModal.style.display = 'none';
    });

    resultModal.addEventListener('click', (e) => {
      if (e.target === resultModal) resultModal.style.display = 'none';
    });

    // 初始化載入
    applyFilter();
  </script>
</body>
</html>
